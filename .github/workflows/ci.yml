name: CI

# Tests every pull request and every push to main. After a merge to main, tags the
# commit v<version> (from app/__init__.py) if that tag doesn't exist yet.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write   # needed only by the tag job to push the release tag

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt
      - name: Check the web UI's JavaScript parses
        run: node --check app/static/app.js
      - name: Run tests
        run: python -m pytest -q

  tag:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag the release
        run: |
          version=$(python3 -c "import re;print(re.search(r'__version__ = \"([\d.]+)\"', open('app/__init__.py').read()).group(1))")
          tag="v${version}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "${tag} already exists"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${tag}" -m "SirisDrone Studio ${version}"
            git push origin "${tag}"
            echo "Tagged ${tag}"
          fi
