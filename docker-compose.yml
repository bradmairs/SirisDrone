# Run on your server/NAS (Unraid, TrueNAS SCALE, Ubuntu, Synology…) or any PC with the NAS
# share mounted. Edit the left-hand side of each volume.
#
# NVIDIA GPU (e.g. RTX 3060): install the NVIDIA driver + NVIDIA Container Toolkit on the host
# (Unraid: the "Nvidia Driver" plugin). The app checks the GPU at start-up; the top bar shows
# "GPU: NVIDIA GeForce RTX 3060" when it is being used. No GPU? Delete the `deploy:` block.
services:
  sirisdrone:
    build: .
    container_name: sirisdrone-studio
    restart: unless-stopped
    # Run as your NAS account so exported files belong to you (and you can rename/delete
    # them over SMB). Find the numbers with `id <your-user>` over SSH; 1026:100 is the
    # usual first user on Synology. Make sure ./data is writable by that user.
    # user: "1026:100"
    ports:
      - "8080:8080"
    environment:
      # Where finished photos/videos are written (paths inside the container).
      SIRIS_OUTPUT_ROOTS: "NAS=/nas/exports"
      # Optional: folders whose footage you can import without uploading.
      SIRIS_INPUT_ROOTS: "Drone footage=/nas/footage"
      # GPU video decode/encode needs the "video" capability (NVENC/NVDEC libraries).
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,video,utility
      # Place names for {place} come from OpenStreetMap; set to "off" to disable lookups.
      # SIRIS_GEOCODER: "off"
      # Optional: password-protect the web UI (do this if it's reachable outside your home).
      # SIRIS_USER: admin
      # SIRIS_PASSWORD: change-me
    volumes:
      - ./data:/data                                 # library, edits, LUTs, settings
      - /volume1/Drone/Exports:/nas/exports          # <- your NAS export folder
      - /volume1/Drone/Footage:/nas/footage:ro       # <- your raw drone footage, incl. the watch "Inbox" (read-only is fine)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
